name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Keep the signing-key cache active so future APKs retain the same certificate.
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: cepindir-android-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: cepindir-android-debug-signing-v1

      - name: Create stable signing key on first build only
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CepIndir Android,O=Hackidim,C=TR"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Save stable signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: cepindir-android-debug-signing-v1

      - name: Verify signing key is available
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Set up Gradle 8.9
        if: github.event_name != 'schedule'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        if: github.event_name != 'schedule'
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: CepIndir-v1.3.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
